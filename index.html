<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#231d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rooster">
  <title>Mijn rooster</title>
  <link rel="stylesheet" href="css/app.css?v=32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demoBand" class="demo-band verborgen">Demo-modus: probeer in te loggen als bijvoorbeeld Sandra (PIN 1111) of Mark (PIN 2222).</div>

  <div id="login" class="login verborgen">
    <div class="login-kaart">
      <img class="login-logo" src="logo-licht.svg" alt="Anytyme De Beurs – Rooster">
      <h1 id="loginBedrijf" class="verborgen">Rooster</h1>
      <div id="stapNaam"><p class="zacht">Wie ben jij?</p><div class="namen" id="namen"></div></div>
      <form id="stapPin" class="verborgen">
        <p>Hoi <b id="pinNaam"></b>, vul je code in</p>
        <div class="pin-invoer"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" style="width:180px;letter-spacing:.4em"></div>
        <button class="knop primair" style="width:100%;justify-content:center">Inloggen</button>
        <p><a href="#" id="terugNaam">Niet jij?</a></p>
      </form>
      <p class="zacht" style="font-size:.8rem;margin-top:1.4em"><a href="beheer.html">Beheer</a></p>
    </div>
  </div>

  <div id="app" class="app verborgen">
    <header class="app-kop">
      <div class="bovenrij">
        <div style="flex:1"><img class="kop-logo" src="logo-donker.svg" alt="Anytyme De Beurs – Rooster"><small id="kopBedrijf" class="verborgen"></small><h1 id="kopNaam"></h1></div>
        <button class="icoon" id="belKnop" aria-label="Meldingen">🔔<span class="badge verborgen" id="belBadge"></span></button>
        <button class="icoon" id="uitKnop" aria-label="Uitloggen" title="Uitloggen">⎋</button>
      </div>
      <div id="volgendeDienst"></div>
      <div class="urenbalk" id="urenBalk"></div>
    </header>
    <main class="app-inhoud" id="inhoud"></main>
    <nav class="onderbalk"><div class="binnen" id="onderbalk">
      <button data-t="mijn" class="actief"><span class="ic">🏠</span>Mijn diensten</button>
      <button data-t="beschikbaar"><span class="ic">🙋</span>Beschikbaar</button>
      <button data-t="rooster"><span class="ic">📅</span>Rooster</button>
      <button data-t="vrij"><span class="ic">🌴</span>Vrij / ziek</button>
      <button data-t="ruil"><span class="ic">🔁</span>Ruilen<span class="badge verborgen" id="ruilBadge"></span></button>
    </div></nav>
  </div>

  <script src="js/config.js?v=32"></script>
  <script src="js/store.js?v=32"></script>
  <script src="js/generator.js?v=32"></script>
  <script src="js/uitvraag.js?v=32"></script>
  <script src="js/push.js?v=32"></script>
  <script src="js/common.js?v=32"></script>
  <script src="js/personeel.js?v=32"></script>
</body>
</html>
