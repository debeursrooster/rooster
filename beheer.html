<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roosterbeheer</title>
  <meta name="theme-color" content="#231d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beheer">
  <link rel="manifest" href="manifest-beheer.json">
  <link rel="stylesheet" href="css/app.css?v=17">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demoBand" class="demo-band verborgen">Demo-modus: gegevens staan alleen in deze browser. <button id="demoReset">Demo opnieuw beginnen</button></div>

  <div id="login" class="login verborgen">
    <form class="login-kaart" id="loginForm">
      <img class="login-logo" src="logo-licht.svg" alt="Anytyme De Beurs – Rooster">
      <h1 id="loginNaam" class="verborgen">Roosterbeheer</h1>
      <p class="zacht">Vul de beheercode in</p>
      <div class="pin-invoer"><input id="adminPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="width:180px;letter-spacing:.4em"></div>
      <button class="knop primair" style="width:100%;justify-content:center">Inloggen</button>
      <p class="zacht" style="margin-top:1em;font-size:.85rem"><a href="index.html">Naar de personeelspagina</a></p>
    </form>
  </div>

  <div id="beheer" class="beheer verborgen">
    <aside class="zijbalk" id="zijbalk">
      <div class="merk"><img class="merk-logo" src="logo-donker.svg" alt="Anytyme De Beurs – Rooster"><b id="bedrijfsnaam" class="verborgen">Roosterbeheer</b><small>Beheer</small></div>
      <nav class="nav" id="nav">
        <a href="#overzicht" data-p="overzicht">🏠 Overzicht</a>
        <a href="#rooster" data-p="rooster">📅 Rooster</a>
        <a href="#aanvragen" data-p="aanvragen">✋ Aanvragen <span class="tel verborgen" id="telAanvragen"></span></a>
        <a href="#zalen" data-p="zalen">🎉 Zalencentrum</a>
        <a href="#cafetaria" data-p="cafetaria">🍟 Cafetaria</a>
        <a href="#personeel" data-p="personeel">👥 Personeel</a>
        <a href="#verzuim" data-p="verzuim">🤒 Verzuim</a>
        <a href="#prikbord" data-p="prikbord">📌 Prikbord</a>
        <a href="#instellingen" data-p="instellingen">⚙️ Instellingen</a>
      </nav>
      <div class="onder"><a href="index.html" target="_blank">Personeelspagina openen ↗</a><br><a href="#" id="uitloggen">Uitloggen</a></div>
    </aside>
    <div>
      <div class="mobiel-kop"><button class="icoon" id="menuKnop" aria-label="Menu">☰</button><img class="mobiel-logo" src="icon.svg" alt=""><b id="mobielTitel">Roosterbeheer</b></div>
      <main class="hoofd" id="hoofd"></main>
    </div>
  </div>

  <script src="js/config.js?v=17"></script>
  <script src="js/store.js?v=17"></script>
  <script src="js/generator.js?v=17"></script>
  <script src="js/uitvraag.js?v=17"></script>
  <script src="js/push.js?v=17"></script>
  <script src="js/common.js?v=17"></script>
  <script src="js/qrcode.js?v=17"></script>
  <script src="js/beheer.js?v=17"></script>
</body>
</html>
